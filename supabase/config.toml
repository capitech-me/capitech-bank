# ============================================================
# Capitech Bank — Supabase local development config
# Usage: supabase start (requires Supabase CLI + Docker)
# ============================================================

project_id = "capitech-bank"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://localhost:3001/*", "http://localhost:3002/*"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = true

[auth.mfa]
enabled = true

[storage]
enabled = true

[realtime]
enabled = true

[analytics]
enabled = true
port = 54327

[functions]
enabled = true
verify_jwt = true
