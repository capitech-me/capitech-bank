# ============================================================
# Capitech Bank — Supabase local development config
# Usage: supabase start (requires Supabase CLI + Docker)
# ============================================================

project_id = "capitech-bank"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://localhost:3001/*", "http://localhost:3002/*"]
# Production hardening (M-5): 1h access-token expiry; signup stays enabled
# (self-service onboarding) but confirmations + MFA are enforced below.
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# Require the user to confirm any email/security-sensitive change (M-5).
double_confirm_changes = true
enable_confirmations = true

[auth.mfa]
enabled = true

# ---------------------------------------------------------------------
# Dashboard-side auth settings that CANNOT be set in config.toml
# (apply them in Supabase Dashboard → Authentication):
#   - Rate limits: Auth → Rate Limits → set per-hour login/signup/token
#     limits appropriate for production (e.g. 30 login, 10 signup, 180
#     token refreshes per hour per IP).
#   - Sessions: enable "Detect and revoke sessions outside the allowed
#     IP range" if applicable; keep refresh-token rotation ON.
#   - SMTP: configure a real provider so confirmation/reset emails send.
#   - Auth Hook: enable the MFA challenge hook and a custom access-token
#     hook for step-up auth on high-risk operations if available.
# ---------------------------------------------------------------------

[storage]
enabled = true

[realtime]
enabled = true

[analytics]
enabled = true
port = 54327

[functions]
enabled = true
verify_jwt = true
