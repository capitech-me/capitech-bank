# ============================================================
# Capitech Bank — Back office (https://admin.capitech.me)
# Netlify: Site 3 of 3 in the monorepo
# ============================================================

[build]
  base = "apps/admin"
  command = "cd ../.. && pnpm install --frozen-lockfile && cd apps/admin && pnpm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_PRIVATE_BUILD_WORKER = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
