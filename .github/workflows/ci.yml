# Capitech Bank — CI pipeline
#
# Jobs:
#   quality   — Gated on every push / PR to master: lint, typecheck, and a
#               sequential build across the monorepo (Turborepo).
#   e2e-prod  — One-click RELEASE CHECK (workflow_dispatch only). Never blocks
#               pushes/PRs. Runs the 26-test production E2E suite against the
#               live deployment (online.capitech.me) using real demo credentials.
#
# Run the release check from GitHub Actions → "CI" → "Run workflow".

name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch: {}

# Cancel in-flight runs for the same ref when a new commit lands, so queued
# runs of an outdated ref don't waste runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality (lint, typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history lets Turborepo use git metadata / remote caching.
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install pnpm first so setup-node can resolve and cache it via the lockfile.
      - name: Set up pnpm 11.9.0 (matches packageManager field)
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js 22 LTS (cached via pnpm-lock.yaml)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint all apps and packages (turbo)
        run: pnpm lint

      - name: Typecheck all apps and packages (turbo)
        run: pnpm typecheck

      - name: Typecheck Playwright e2e specs
        run: pnpm exec tsc --noEmit -p e2e/tsconfig.json
        continue-on-error: true

      # Sequential build: parallel Turbopack builds can flake while downloading
      # Google Fonts (fonts.gstatic.com), so force --concurrency=1.
      - name: Build all apps sequentially (turbo)
        run: pnpm exec turbo build --concurrency=1

  # One-click release check — run manually via GitHub Actions (workflow_dispatch).
  # Signs in as the real demo users and validates the live site end-to-end.
  e2e-prod:
    name: E2E Production (one-click release check)
    runs-on: ubuntu-latest
    # Manual only — never blocks pushes/PRs. The top-level `on:` triggers apply
    # to ALL jobs, so gate this job explicitly.
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm 11.9.0 (matches packageManager field)
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js 22 LTS (cached via pnpm-lock.yaml)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # --with-deps installs Chromium plus its OS dependencies (apt via sudo,
      # available on ubuntu-latest runners).
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Runs the production suite (e2e-prod/) against online.capitech.me.
      # Uses the committed demo credentials (jane@capitech.me / admin@capitech.me)
      # — no CI secrets required.
      - name: Run production E2E release check
        run: pnpm test:e2e:prod
